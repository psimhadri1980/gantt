# Weekly pull requests for outdated npm packages and GitHub Actions; security updates arrive as soon as published.
# The `npm` ecosystem also covers pnpm: Dependabot reads and updates pnpm-lock.yaml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
