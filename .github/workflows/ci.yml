name: CI

# Every pull request runs the unit checks and the end-to-end browser tests; so does every push to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run lint
      # The API reference in docs/api is generated from the sources; fail if a change was not regenerated.
      - run: npm run docs:api -- --check
      - run: npm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Known vulnerabilities in installed packages. Runtime dependencies fail on moderate and above;
      # development-only tools (bundler, test runner) fail on high and above.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      # Every installed package's registry signature and provenance attestation is checked.
      - run: npm ci --ignore-scripts && npm audit signatures

  e2e:
    name: End-to-end (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners include Google Chrome at /usr/bin/google-chrome, which the tests drive headless.
      - run: google-chrome --version
      - run: npm run e2e
        env:
          CI: 'true'
