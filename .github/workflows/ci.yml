name: CI

# Every pull request runs the unit checks and the end-to-end browser tests; so does every push to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm first, so setup-node can cache its store; the version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:boundaries
      - run: pnpm run typecheck
      - run: pnpm run lint
      # The API reference in docs/api is generated from the sources; fail if a change was not regenerated.
      - run: ppnpm run docs:api --check
      - run: pnpm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pnpm first, so setup-node can cache its store; the version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Known vulnerabilities in installed packages. Runtime dependencies fail on moderate and above;
      # development-only tools (bundler, test runner) fail on high and above.
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm audit --audit-level high
      # The lockfile is checked against the supply-chain policies in pnpm-workspace.yaml (no provenance
      # downgrade, no version younger than a day) before anything is installed; no install scripts run.
      - run: pnpm install --frozen-lockfile --ignore-scripts

  e2e:
    name: End-to-end (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # pnpm first, so setup-node can cache its store; the version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub's Ubuntu runners include Google Chrome at /usr/bin/google-chrome, which the tests drive headless.
      - run: google-chrome --version
      - run: pnpm run e2e
        env:
          CI: 'true'
