name: Dependency review

# On each pull request, compares the dependencies before and after the change and fails if the change adds a
# package with a known vulnerability (moderate or worse) or a licence outside the allowed list.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
